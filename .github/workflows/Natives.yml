name: Natives

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-libraries:
    name: ${{ matrix.type }}-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: Libraries, name: linux-arm64, os: ubuntu-22.04-arm, cpu: aarch64, file: Linux.sh }
          - { type: Libraries, name: linux-x64, os: ubuntu-22.04, cpu: x86_64, file: Linux.sh }
        
          - { type: Libraries, name: win-arm64, os: windows-11-arm, cpu: arm64, file: Windows.sh }
          - { type: Libraries, name: win-x64, os: windows-2022, cpu: x64, file: Windows.sh }
        
          - { type: Libraries, name: osx-x64, os: macos-15-intel, cpu: x86_64, file: Mac.sh }
          - { type: Libraries, name: osx-arm64, os: macos-15, cpu: arm64, file: Mac.sh }
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build
        shell: bash
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          chmod +x .github/scripts/${{ matrix.file }}
          ./.github/scripts/${{ matrix.file }}

      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.type }}-${{ matrix.name }}
          path: outputs


    build-libraries:
      name: ${{ matrix.type }}-${{ matrix.name }}
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          include:
            - { type: Bindings, name: sdl, os: windows-2022, file: SDL.sh }

      steps:
        - name: Checkout
          uses: actions/checkout@v6.0.2

        - name: Build
          shell: bash
          run: |
            chmod +x .github/scripts/${{ matrix.file }}
            ./.github/scripts/${{ matrix.file }}

        - name: Upload
          uses: actions/upload-artifact@v7.0.1
          with:
            name: ${{ matrix.type }}-${{ matrix.name }}
            path: outputs
          
  publish:
    name: Publish
    needs: build-bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Branch
        run: |
          git push origin --delete Natives || true
          git checkout --orphan Natives
          git rm -rf . || true
          git clean -fdx || true

      - name: Download
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Commit
        run: |
          for DIR in artifacts/*; do
            [ -d "$DIR" ] || continue
            NAME=$(basename "$DIR")
            TYPE="${NAME%%-*}"
            DESTINATION="${NAME#*-}"
            mkdir -p "$TYPE/$DESTINATION"
            cp -r "$DIR"/. "$TYPE/$DESTINATION"/
          done
          
          git add . ':!artifacts'
          git commit -m "Natives"
          git push origin Natives --force

      - name: Reference
        run: |
          SUBMODULE_PATH="Engine/Natives"

          git checkout ${{ github.ref_name }}

          if [ -d "$SUBMODULE_PATH/.git" ] || [ -f ".gitmodules" ]; then
            git submodule set-url "$SUBMODULE_PATH" "https://github.com/${{ github.repository }}"
          else
            git submodule add -b Natives "https://github.com/${{ github.repository }}" "$SUBMODULE_PATH"
          fi

          git submodule set-branch -b Natives -- "$SUBMODULE_PATH"
          git submodule update --init --force --remote "$SUBMODULE_PATH"

          git add .gitmodules "$SUBMODULE_PATH"
          git commit -m "Natives" || echo "No changes"
          git push origin ${{ github.ref_name }}